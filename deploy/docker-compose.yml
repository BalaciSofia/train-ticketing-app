services:
  postgres:
    image: postgres:16
    container_name: train_ticketing_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: train_db
    ports:
      - "5432:5432"
    volumes:
      - train_db_data:/var/lib/postgresql/data

volumes:
  train_db_data:
