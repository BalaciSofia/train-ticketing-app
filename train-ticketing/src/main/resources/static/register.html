<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Ticketing — Register</title>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

<div class="card">
    <div class="logo">
        <h1>Train Ticketing</h1>
        <p class="subtitle">Create an account</p>
    </div>

    <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Choose a username" autocomplete="username" required>
        </div>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Choose a password" autocomplete="new-password" required>
        </div>
        <div class="field">
            <label for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" placeholder="Repeat your password" autocomplete="new-password" required>
        </div>
        <button type="submit" id="submitBtn">Register</button>
        <div class="error" id="errorMsg"></div>
        <div class="success" id="successMsg">Account created! Redirecting to login…</div>
    </form>
    <p class="register-link">Already have an account? <a href="/login.html">Log in</a></p>
</div>

<script src="/js/register.js"></script>
</body>
</html>
